# Themes: named groups of large-cap stocks you can focus the dashboard on (the "Focus" chips).
# A stock can sit in several themes (Nvidia is both AI and Semiconductors). Every ticker must be in universe.csv;
# a test checks that. Add, remove or rename themes freely: the dashboard builds its chips from this file.
#
# Themes are a browsing aid, not a screen: they never change whether a stock counts as a dip or how quality is scored.
# Membership is a hand-made judgement about where most of a company's business is, as of late 2026.

[[theme]]
id = "ai"
name = "AI & cloud"
desc = "Companies whose growth story is tied to AI: cloud platforms, AI chips, data-centre networking and AI software."
tickers = ["NVDA", "MSFT", "GOOGL", "AMZN", "META", "ORCL", "AVGO", "AMD", "ANET", "CRM", "NOW", "IBM", "EQIX", "SAP.DE", "ASML.AS", "SU.PA"]

